name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: skills/tts/src/go.sum
      - if: runner.os == 'Linux'
        run: make lint
      - run: make test
      - name: Cross-compile every release target
        run: make checksums
      - name: Smoke test
        run: make build && ./dist/tts version && ./dist/tts doctor
      - if: runner.os == 'macOS'
        run: ./dist/tts -p system -o speech.wav "smoke test" && afinfo speech.wav
