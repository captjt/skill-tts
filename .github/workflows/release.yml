name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release
      id-token: write # sign build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: skills/tts/src/go.sum
      - name: Tag matches launcher version
        run: test "v$(sed -n 's/^VERSION=//p' skills/tts/scripts/tts)" = "$GITHUB_REF_NAME"
      - run: make test
      - name: Rebuild and verify against the launcher's pinned hashes
        run: make verify-pins
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tts-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/tts-* dist/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --notes "Reproducible builds of tts for macOS and Linux.

          Verify a download: \`gh attestation verify tts-darwin-arm64 --repo $GITHUB_REPOSITORY\`
          Rebuild it yourself: \`git checkout $GITHUB_REF_NAME && make verify-pins\`"
